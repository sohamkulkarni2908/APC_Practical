
<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>

    <style>
        body {
            font-family: Arial;
            background: #e8edff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px #bbb;
        }

        h2 {
            text-align: center;
            color: #4b5bdc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4b5bdc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #303fa8;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>User Login</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username"
                   placeholder="Enter Username"
                   maxlength="20" required>

            <input type="password" name="password"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
    </div>

</body>
</html>
